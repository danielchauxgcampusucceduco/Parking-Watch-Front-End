# Integración continua de cupo-frontend (RNF-10.2): en cada pull request se ejecutan ESLint,
# Prettier, TypeScript, Vitest con cobertura (>= 70 %), la revisión de vulnerabilidades y la
# prueba de contrato (tipos generados desde el OpenAPI publicado por cupo-backend). Vercel crea la
# URL de vista previa; el job e2e corre Playwright contra cada despliegue (vista previa y producción).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Estilo y tipos
        run: pnpm lint && pnpm typecheck
      - name: Pruebas unitarias con cobertura
        run: pnpm test:coverage
      - name: Contrato OpenAPI (versión del contrato declarada en vars.OPENAPI_URL)
        if: vars.OPENAPI_URL != ''
        run: |
          pnpm exec openapi-typescript "${{ vars.OPENAPI_URL }}" -o src/api/schema.d.ts
          git diff --exit-code src/api/schema.d.ts
      - name: Vulnerabilidades de dependencias
        run: pnpm audit --audit-level critical
      - run: pnpm build

  e2e:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Playwright contra el despliegue de Vercel
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
